terms:`<h3>Términos de uso de Pawlk</h3><p><b>1. Quién somos.</b> Pawlk es una plataforma que pone en contacto a personas con perro («Dueños») con personas que se ofrecen a pasearlo («Paseadores»). Responsable: {{NAME}}, NIF {{NIF}}, {{ADDRESS}}. Contacto: {{EMAIL}}.</p>
<p><b>2. Qué es Pawlk y qué no.</b> Pawlk es solo un intermediario tecnológico. No presta servicios de paseo ni de cuidado de animales, no emplea ni representa a Dueños o Paseadores y no es parte de los acuerdos entre ellos. No garantiza la identidad, la aptitud o el comportamiento de las personas ni de los perros. Las marcas como «Verificado» indican solo que el administrador comprobó algún dato en un momento dado; no son una garantía.</p>
<p><b>3. Requisitos.</b> Debes tener 18 años o más, facilitar datos veraces, tener una sola cuenta y mantener en secreto tu acceso. Eres responsable de lo que se haga con tu cuenta.</p>
<p><b>4. Obligaciones del Dueño.</b> Informar con veracidad sobre salud, vacunas, carácter y cualquier historial de agresividad o fugas de su perro; cumplir la normativa aplicable (identificación con microchip, vacunación, licencia o seguro si la ley los exige para su perro); estar localizable durante el paseo; facilitar collar, arnés y correa adecuados; y autorizar la atención veterinaria urgente asumiendo su coste.</p>
<p><b>5. Obligaciones del Paseador.</b> Cuidar al perro con la diligencia debida; cumplir la normativa municipal y autonómica (correa, zonas permitidas, recogida de excrementos); no ceder el perro a terceros ni soltarlo sin permiso; avisar de inmediato de cualquier incidente; enviar el parte del paseo; y devolver el perro a la hora acordada. Responde de los daños que cause por su culpa o negligencia conforme a la ley.</p>
<p><b>6. Precios y pagos.</b> Los precios los fijan los usuarios. Pawlk no gestiona cobros: se acuerdan y pagan directamente entre las partes. Si en el futuro se incorporan pagos dentro de la app, se informará y se aplicarán condiciones específicas. Cada usuario es responsable de sus obligaciones fiscales, laborales y de seguridad social.</p>
<p><b>7. Cancelaciones.</b> Pueden hacerse desde la app. Se ruega avisar con antelación; las cancelaciones reiteradas pueden dar lugar a restricciones.</p>
<p><b>8. Incidentes y responsabilidad.</b> Pawlk no responde de lesiones, enfermedades, fugas, pérdidas, daños o fallecimiento del perro, de las personas o de terceros derivados de un paseo, ni de la conducta de los usuarios, en la medida en que la ley permita excluirlo. Lo anterior no limita la responsabilidad que la ley no permite excluir ni los derechos irrenunciables de los consumidores. Entre sí, las partes responden conforme a la legislación civil.</p>
<p><b>9. Seguros.</b> Pawlk no ofrece ni contrata seguros en nombre de los usuarios. Se recomienda a los Dueños y Paseadores comprobar sus propios seguros (responsabilidad civil del propietario del animal, responsabilidad civil profesional del paseador) y la normativa de su comunidad autónoma y municipio.</p>
<p><b>10. Contenido.</b> Eres responsable de lo que publicas (fotos, textos, valoraciones). Concedes a Pawlk una licencia gratuita y no exclusiva para alojarlo y mostrarlo dentro del servicio mientras tengas cuenta. No publiques contenido de terceros sin derecho a ello ni fotos de personas sin su consentimiento.</p>
<p><b>11. Normas, moderación y suspensión.</b> Debes cumplir las Normas de la comunidad. Pawlk puede ocultar contenido o suspender cuentas que las incumplan, explicando el motivo; puedes recurrir escribiendo a {{EMAIL}}.</p>
<p><b>12. Contenido ilegal.</b> Puedes notificar contenido que consideres ilegal con el botón «Denunciar» o escribiendo a {{EMAIL}}, que es nuestro punto de contacto. Revisaremos la notificación con diligencia y actuaremos cuando proceda.</p>
<p><b>13. Mensajes cifrados.</b> Los mensajes, fechas, precios, partes y datos de emergencia se cifran de extremo a extremo: Pawlk no puede leerlos. Si pierdes tu clave, no podrás recuperar tus conversaciones. Ante un requerimiento legal solo podremos aportar los datos que no están cifrados.</p>
<p><b>14. Datos personales.</b> Se tratan según la Política de privacidad.</p>
<p><b>15. Propiedad intelectual.</b> El nombre, diseño y código de Pawlk pertenecen a su titular. No puedes copiarlos ni usarlos sin permiso.</p>
<p><b>16. Disponibilidad.</b> El servicio se ofrece «tal cual», puede tener interrupciones o cambios y se encuentra en fase de pruebas.</p>
<p><b>17. Cambios.</b> Podemos modificar estos términos avisando en la app. Si no estás de acuerdo, puedes borrar tu cuenta.</p>
<p><b>18. Ley y jurisdicción.</b> Se aplica la ley española. Si eres consumidor, podrás acudir a los tribunales de tu domicilio; en otro caso, a los de {{CITY}}.</p>`,
privacy:`<h3>Política de privacidad</h3><p><b>Responsable.</b> {{NAME}}, NIF {{NIF}}, {{ADDRESS}}. Contacto de privacidad: {{EMAIL}}.</p>
<p><b>Qué datos tratamos.</b></p><ul><li><b>Cuenta:</b> correo electrónico e identificador.</li><li><b>Perfil:</b> nombre visible, foto, ciudad y presentación (los que tú decidas poner).</li><li><b>Perros:</b> ficha, fotos, vídeos y fechas. La ubicación del perro se redondea a ~1 km.</li><li><b>Ubicación:</b> la tuya (aproximada, si la indicas) y, durante un paseo, el recorrido GPS del Paseador, que se envía cifrado al Dueño.</li><li><b>Solicitudes, mensajes, partes y datos de emergencia:</b> cifrados de extremo a extremo.</li><li><b>Valoraciones y denuncias,</b> bloqueos, preferencias y el registro de tu consentimiento.</li><li><b>Datos técnicos</b> (p. ej. dirección IP) en los registros de nuestros proveedores.</li></ul>
<p><b>Para qué y con qué base legal.</b></p><ul><li>Prestarte el servicio (cuenta, perfiles, solicitudes, chat): ejecución del contrato (art. 6.1.b RGPD).</li><li>Usar tu ubicación, fotos opcionales y avisos del navegador: tu consentimiento (6.1.a), que puedes retirar cuando quieras.</li><li>Seguridad, prevención de fraude y moderación de denuncias: interés legítimo (6.1.f).</li><li>Cumplir obligaciones legales (6.1.c), por ejemplo requerimientos de autoridades.</li></ul>
<p><b>Quién ve tus datos.</b> Los demás usuarios ven lo que publicas (perfil, perros, valoraciones). Los datos cifrados solo los ven las dos personas implicadas. Usamos proveedores que actúan como encargados del tratamiento: {{PROVIDERS}}. Algunos pueden estar fuera del Espacio Económico Europeo; en tal caso se apoyan en garantías adecuadas (como las cláusulas contractuales tipo). No vendemos tus datos ni los usamos para publicidad.</p>
<p><b>Cuánto tiempo.</b> Mientras tengas cuenta. Al borrarla eliminamos tus datos de la aplicación; pueden persistir copias de seguridad hasta {{RETENTION}} y los datos que debamos conservar por ley. Las valoraciones que otras personas escribieron sobre ti pueden quedar sin identificarte, y los mensajes cifrados que la otra persona conserva dejan de poder leerse sin tu clave.</p>
<p><b>Tus derechos.</b> Acceso, rectificación, supresión, oposición, limitación y portabilidad. Desde tu perfil puedes <b>exportar tus datos</b> y <b>borrar tu cuenta</b>, y quitar tu ubicación. También puedes escribir a {{EMAIL}}. Si crees que no tratamos bien tus datos, puedes reclamar ante la Agencia Española de Protección de Datos (www.aepd.es).</p>
<p><b>Seguridad.</b> Cifrado de extremo a extremo en lo sensible, reglas de acceso por usuario en la base de datos y conexión segura. Sigue siendo visible quién se ofrece a quién, sobre qué perro y cuándo (metadatos).</p>
<p><b>Menores.</b> Pawlk es solo para mayores de 18 años y no recoge datos de menores a sabiendas.</p>
<p><b>Almacenamiento en tu dispositivo.</b> Usamos únicamente almacenamiento técnico imprescindible (sesión, idioma, recorrido en curso). No usamos cookies publicitarias ni de seguimiento.</p>
<p><b>Cambios.</b> Si cambiamos esta política te avisaremos en la app.</p>`,
rules:`<h3>Normas de la comunidad</h3><ul><li><b>Respeto:</b> trata bien a las personas y a los animales. Nada de insultos, acoso, discriminación ni amenazas.</li><li><b>Cero maltrato:</b> no se tolera el maltrato ni el abandono de animales. Se denunciará.</li><li><b>Información veraz:</b> perfil, ficha del perro y valoraciones honestos. No suplantes a nadie ni crees varias cuentas.</li><li><b>Fotos adecuadas:</b> solo fotos tuyas o de tu perro. Nada de desnudos, violencia ni fotos de otras personas sin permiso.</li><li><b>Sin spam ni publicidad,</b> ni cobros fuera de lo acordado en la app.</li><li><b>Privacidad:</b> no compartas datos de terceros (teléfonos, direcciones) sin su consentimiento.</li><li><b>Seguridad primero:</b> avisa de cualquier incidente y no pongas al perro en riesgo (calor, tráfico, otros perros).</li><li><b>Denuncia</b> lo que incumpla estas normas con el botón 🚩. Podemos ocultar contenido o suspender cuentas.</li></ul>`,
safety:`<h3>Consejos de seguridad</h3><p><b>Antes del primer paseo</b></p><ul><li>Revisa el perfil, las valoraciones y la marca ✅ de la otra persona.</li><li>Quedad la primera vez en un lugar público y conoced al perro con su dueño presente.</li><li>El Dueño debe completar la ficha: vacunas, carácter, salud y contacto de emergencia.</li><li>Acordad por escrito en el chat hora, duración, ruta, precio y qué hacer en una emergencia.</li></ul>
<p><b>Durante el paseo</b></p><ul><li>Usa siempre correa y arnés o collar bien ajustados; respeta las zonas y la normativa del municipio.</li><li>Cuidado con el calor, el asfalto caliente y la falta de agua.</li><li>No sueltes al perro ni lo dejes con otra persona. Recoge siempre los excrementos.</li><li>Inicia el paseo en la app para registrar tiempo y recorrido, y haz fotos del paseo.</li></ul>
<p><b>Si pasa algo</b></p><ul><li>Urgencia veterinaria: llama al veterinario del contacto de emergencia. Emergencia con personas: <b>112</b>.</li><li>Si el perro se escapa, avisa de inmediato al Dueño, busca la zona cercana y contacta con la policía local.</li><li>Cuéntalo en el parte (opción «Hubo un problema») y, si hace falta, denuncia desde la app.</li></ul>
<p>Pawlk no incluye seguro: comprueba vuestros seguros de responsabilidad civil antes de empezar.</p>`

terms:`<h3>Pawlk Terms of Use</h3><p><b>1. Who we are.</b> Pawlk is a platform that connects dog owners (“Owners”) with people who offer to walk their dogs (“Walkers”). Controller: {{NAME}}, tax ID {{NIF}}, {{ADDRESS}}. Contact: {{EMAIL}}. (The Spanish version prevails.)</p>
<p><b>2. What Pawlk is and is not.</b> Pawlk is only a technology intermediary. It does not provide dog-walking or animal-care services, does not employ or represent Owners or Walkers and is not a party to their agreements. It does not guarantee anyone’s identity, suitability or behavior, or any dog’s. Marks such as “Verified” only mean the administrator checked some detail at some point; they are not a guarantee.</p>
<p><b>3. Requirements.</b> You must be 18 or older, give truthful information, keep a single account and keep your access private. You are responsible for what happens through your account.</p>
<p><b>4. Owner duties.</b> Be truthful about your dog’s health, vaccinations, temperament and any history of aggression or escapes; comply with applicable rules (microchip, vaccination, license or insurance where required); be reachable during the walk; provide a suitable collar/harness and leash; and authorize urgent veterinary care, covering its cost.</p>
<p><b>5. Walker duties.</b> Care for the dog with due diligence; follow local and regional rules (leash, permitted areas, picking up waste); never hand the dog to others or let it off-leash without permission; report any incident immediately; send the walk report; and return the dog on time. Walkers are liable for damage caused by their fault or negligence as provided by law.</p>
<p><b>6. Prices and payments.</b> Users set their own prices. Pawlk does not process payments: they are agreed and paid directly between the parties. If in-app payments are added, you will be informed and specific terms will apply. Each user is responsible for their own tax, employment and social-security obligations.</p>
<p><b>7. Cancellations.</b> They can be made in the app. Please give notice; repeated cancellations may lead to restrictions.</p>
<p><b>8. Incidents and liability.</b> To the extent the law allows, Pawlk is not liable for injury, illness, escape, loss, damage or death of the dog, people or third parties arising from a walk, or for users’ conduct. This does not limit liability that cannot be excluded by law or consumers’ non-waivable rights. Between themselves, the parties are liable under civil law.</p>
<p><b>9. Insurance.</b> Pawlk does not offer or take out insurance on users’ behalf. Owners and Walkers should check their own cover (owner’s liability, walker’s professional liability) and local rules.</p>
<p><b>10. Content.</b> You are responsible for what you post (photos, text, reviews). You grant Pawlk a free, non-exclusive license to host and display it within the service while you have an account. Do not post third-party content without the right to do so, or photos of people without consent.</p>
<p><b>11. Rules, moderation and suspension.</b> You must follow the Community Rules. Pawlk may hide content or suspend accounts that break them, stating the reason; you can appeal at {{EMAIL}}.</p>
<p><b>12. Illegal content.</b> You can report content you consider illegal with the “Report” button or by writing to {{EMAIL}}, our point of contact. We will review notices diligently and act where appropriate.</p>
<p><b>13. Encrypted messages.</b> Messages, dates, prices, reports and emergency details are end-to-end encrypted: Pawlk cannot read them. If you lose your key you cannot recover your conversations. In response to a legal order we can only provide data that is not encrypted.</p>
<p><b>14. Personal data.</b> Handled under the Privacy Policy.</p>
<p><b>15. Intellectual property.</b> Pawlk’s name, design and code belong to its owner. Do not copy or use them without permission.</p>
<p><b>16. Availability.</b> The service is provided “as is”, may be interrupted or change, and is in a testing phase.</p>
<p><b>17. Changes.</b> We may change these terms by notifying you in the app. If you disagree, you can delete your account.</p>
<p><b>18. Law and courts.</b> Spanish law applies. Consumers may use the courts of their home; otherwise, the courts of {{CITY}}.</p>`,
privacy:`<h3>Privacy Policy</h3><p><b>Controller.</b> {{NAME}}, tax ID {{NIF}}, {{ADDRESS}}. Privacy contact: {{EMAIL}}. (The Spanish version prevails.)</p>
<p><b>Data we process.</b></p><ul><li><b>Account:</b> email address and identifier.</li><li><b>Profile:</b> display name, photo, city and bio (whatever you choose to add).</li><li><b>Dogs:</b> profile, photos, videos and dates. A dog’s location is rounded to ~1 km.</li><li><b>Location:</b> yours (approximate, if you set it) and, during a walk, the Walker’s GPS route, sent encrypted to the Owner.</li><li><b>Requests, messages, reports and emergency details:</b> end-to-end encrypted.</li><li><b>Reviews and reports,</b> blocks, preferences and your consent record.</li><li><b>Technical data</b> (e.g. IP address) in our providers’ logs.</li></ul>
<p><b>Why and legal basis.</b></p><ul><li>Providing the service (account, profiles, requests, chat): performance of a contract (GDPR art. 6.1.b).</li><li>Using your location, optional photos and browser alerts: your consent (6.1.a), which you can withdraw at any time.</li><li>Security, fraud prevention and handling reports: legitimate interest (6.1.f).</li><li>Legal obligations (6.1.c), e.g. authority requests.</li></ul>
<p><b>Who sees your data.</b> Other users see what you publish (profile, dogs, reviews). Encrypted data is visible only to the two people involved. We use processors: {{PROVIDERS}}. Some may be outside the European Economic Area, relying on appropriate safeguards (such as standard contractual clauses). We do not sell your data or use it for advertising.</p>
<p><b>Retention.</b> While you have an account. When you delete it we remove your data from the app; backups may persist up to {{RETENTION}} along with data we must keep by law. Reviews others wrote about you may remain without identifying you, and encrypted messages kept by the other person become unreadable without your key.</p>
<p><b>Your rights.</b> Access, rectification, erasure, objection, restriction and portability. From your profile you can <b>export your data</b>, <b>delete your account</b> and remove your location. You can also write to {{EMAIL}}. You may complain to the Spanish Data Protection Agency (www.aepd.es).</p>
<p><b>Security.</b> End-to-end encryption for sensitive data, per-user access rules in the database and secure connections. Who offers to walk whose dog, and when, remains visible (metadata).</p>
<p><b>Minors.</b> Pawlk is for people aged 18 or over and does not knowingly collect minors’ data.</p>
<p><b>Device storage.</b> We only use strictly necessary storage (session, language, walk in progress). No advertising or tracking cookies.</p>
<p><b>Changes.</b> If we change this policy we will tell you in the app.</p>`,
rules:`<h3>Community Rules</h3><ul><li><b>Respect:</b> treat people and animals well. No insults, harassment, discrimination or threats.</li><li><b>Zero cruelty:</b> animal abuse or abandonment is not tolerated and will be reported.</li><li><b>Honesty:</b> truthful profiles, dog details and reviews. Do not impersonate anyone or create multiple accounts.</li><li><b>Appropriate photos:</b> only photos of you or your dog. No nudity, violence or photos of others without permission.</li><li><b>No spam or ads,</b> and no charging outside what was agreed in the app.</li><li><b>Privacy:</b> do not share others’ details (phones, addresses) without consent.</li><li><b>Safety first:</b> report incidents and never put the dog at risk (heat, traffic, other dogs).</li><li><b>Report</b> anything that breaks these rules with the 🚩 button. We may hide content or suspend accounts.</li></ul>`,
safety:`<h3>Safety tips</h3><p><b>Before the first walk</b></p><ul><li>Check the other person’s profile, reviews and ✅ mark.</li><li>Meet the first time in a public place, with the owner present.</li><li>Owners should complete the dog profile: vaccines, temperament, health and emergency contact.</li><li>Agree in the chat on time, length, route, price and what to do in an emergency.</li></ul>
<p><b>During the walk</b></p><ul><li>Always use a leash and a well-fitted harness or collar; follow local areas and rules.</li><li>Watch out for heat, hot pavement and lack of water.</li><li>Never let the dog off-leash or leave it with someone else. Always pick up waste.</li><li>Start the walk in the app to record time and route, and take photos.</li></ul>
<p><b>If something happens</b></p><ul><li>Veterinary emergency: call the vet from the emergency contact. Emergency involving people: <b>112</b>.</li><li>If the dog escapes, tell the Owner immediately, search the nearby area and contact the local police.</li><li>Describe it in the report (“There was a problem”) and report from the app if needed.</li></ul>
<p>Pawlk does not include insurance: check your liability cover before you start.</p>`
